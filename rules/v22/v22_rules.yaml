version: "22.1"
description: "Python AST rule catalog used by Code Quality Guard."
rules:
  - id: security.eval_exec
    category: security
    severity: critical
    description: "检测到 eval() 使用，存在代码注入风险"
    fix: "使用 json.loads() 或 ast.literal_eval() 替代"
    confidence: 0.95
  - id: security.exec
    category: security
    severity: critical
    description: "检测到 exec() 使用，存在代码注入风险"
    fix: "重构代码避免使用 exec()"
    confidence: 0.95
  - id: security.hardcoded_secret
    category: security
    severity: critical
    description: "检测到硬编码密钥/密码"
    fix: "使用环境变量或密钥管理服务"
    confidence: 0.90
  - id: security.sql_injection
    category: security
    severity: critical
    description: "检测到动态 SQL 语句，存在注入风险"
    fix: "使用参数化查询"
    confidence: 0.85
  - id: security.ssl_disabled
    category: security
    severity: critical
    description: "SSL 验证被禁用，存在中间人攻击风险"
    fix: "启用 SSL 验证"
    confidence: 0.95
  - id: security.command_injection
    category: security
    severity: critical
    description: "检测到不安全的 shell 命令执行"
    fix: "使用 subprocess.run() 参数列表并保持 shell=False"
    confidence: 0.90
  - id: security.unsafe_deserialization
    category: security
    severity: critical
    description: "检测到不安全的反序列化，输入内容可能执行代码"
    fix: "使用安全的反序列化格式或安全 loader"
    confidence: 0.90
  - id: security.path_traversal
    category: security
    severity: high
    description: "文件路径包含父目录跳转，需确认路径受到约束"
    fix: "将用户提供的路径限制在预期目录内"
    confidence: 0.80
  - id: security.insecure_random
    category: security
    severity: warning
    description: "检测到使用不适合安全用途的随机数生成器"
    fix: "使用 secrets 模块生成安全随机数"
    confidence: 0.85
  - id: ai_slop.bare_except
    category: error_handling
    severity: high
    description: "检测到裸 except，应捕获具体异常类型"
    fix: "捕获具体异常类型，如 except ValueError:"
    confidence: 0.95
  - id: ai_slop.swallow_exception
    category: error_handling
    severity: high
    description: "异常被吞没，可能导致难以调试的问题"
    fix: "记录日志并按预期处理或重新抛出异常"
    confidence: 0.90
  - id: ai_slop.generic_exception
    category: error_handling
    severity: high
    description: "捕获通用 Exception，应评估是否可以捕获更具体的异常"
    fix: "捕获具体异常类型，或说明宽泛捕获的边界"
    confidence: 0.85
  - id: code_quality.function_too_long
    category: code_quality
    severity: warning
    description: "函数过长"
    fix: "拆分为多个职责单一的子函数"
    confidence: 0.80
  - id: code_quality.too_many_parameters
    category: code_quality
    severity: warning
    description: "参数过多"
    fix: "使用对象封装参数"
    confidence: 0.85
  - id: code_quality.deep_nesting
    category: code_quality
    severity: warning
    description: "嵌套过深"
    fix: "提取为独立函数或使用 early return"
    confidence: 0.80
  - id: code_quality.line_too_long
    category: code_quality
    severity: warning
    description: "行过长"
    fix: "拆分表达式或调整数据结构"
    confidence: 0.90
  - id: code_quality.missing_docstring
    category: code_quality
    severity: info
    description: "公开定义缺少文档字符串"
    fix: "添加简洁说明，描述职责、参数约束和重要副作用"
    confidence: 0.80
  - id: ai_slop.redundant_todo
    category: code_quality
    severity: info
    description: "存在 TODO/FIXME 标记"
    fix: "创建任务或直接修复"
    confidence: 0.70
